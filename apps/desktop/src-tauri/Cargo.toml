[package]
name = "mindmap-desktop"
version = "0.1.0"
description = "极简自由脑图工具桌面 host（Tauri 2）"
edition = "2021"

[lib]
name = "mindmap_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
