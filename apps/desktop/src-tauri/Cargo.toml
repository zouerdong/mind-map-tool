[package]
name = "mindmap-desktop"
version = "0.1.0"
description = "极简自由脑图工具桌面 host（Tauri 2）"
license = "MIT"
edition = "2021"

[lib]
name = "mindmap_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"

[dev-dependencies]
tempfile = "3"

# macOS 文档保存面板的可见格式选择（OFR-2026-09-14 #3，src/ipc/save_panel.rs）。
# objc2 全家与 block2 已由 rfd/wry 以相同版本引入依赖图，此处仅声明直接依赖
# 并打开所需 feature；lockfile 不新增 crate，包体影响仅为少量 FFI 胶水。
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
    "NSApplication",
    "NSButton",
    "NSControl",
    "NSMenu",
    "NSMenuItem",
    "NSPanel",
    "NSPopUpButton",
    "NSResponder",
    "NSSavePanel",
    "NSTextField",
    "NSView",
    "NSWindow",
    "block2",
] }
objc2-foundation = { version = "0.3", features = [
    "NSArray",
    "NSGeometry",
    "NSObject",
    "NSString",
    "NSURL",
] }

[profile.release]
strip = true
lto = true
# size 优化：v1 DMG 预算 25,000,000B（ADR 0006 decimal MB）临界；
# Rust 壳层非帧循环热点（canvas/edit 在 WebView 侧），优先压缩二进制体积。
opt-level = "s"
