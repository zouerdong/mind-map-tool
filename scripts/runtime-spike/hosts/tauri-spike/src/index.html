    <h3>Tauri Spike 空白画布占位</h3>

    // renderer-ready marker mirrors the Electron spike: 2 rAF after scripts run
    requestAnimationFrame(() => requestAnimationFrame(async () => {
      window.__READY = true;
      try { await window.__TAURI__.core.invoke("spike_ready"); } catch (e) { console.warn(e); }
    }));
  </script>
